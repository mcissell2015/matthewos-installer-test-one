<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>DeepAI Code Snippet</title><meta name="title" content="DeepAI Code Snippet"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


  <title>Installer</title>


  <div id="hide">
    <h1>MatthewOS Installer</h1>
    <button onclick="full()">Start Installation</button>
  </div>
  <div id="show" style="display:none;">
    <h1>MatthewOS Installer</h1>
    <h3 id="add">0% Installed</h3>
  </div>

  <script>
    let count = 0;

    function full() {
      // Request fullscreen
      document.documentElement.requestFullscreen();

      // Hide initial div and show progress
      document.getElementById('hide').style.display = "none";
      document.getElementById('show').style.display = "block";

      // Start progress animation
      add();

      // Trigger Node.js filesystem creation via an API or Electron IPC
      // For simplicity, assume you call a function here
      // e.g., send a request to backend server to create files
      fetch('/create-files')
        .then(response => response.text())
        .then(data => console.log(data))
        .catch(err => console.error(err));
    }

    function add() {
      if (count >= 100) {
        count = 100;
        document.getElementById('add').innerText = count + "% Installed";
        return;
      }
      count++;
      document.getElementById('add').innerText = count + "% Installed";
      setTimeout(add, 400);
    }
  </script>

<script src="./script.js"></script></body></html>
